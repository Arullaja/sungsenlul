[phases.setup]
nixPkgs = [
  "nodejs_18",
  "chromium",
  "glib",
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "at-spi2-core",
  "cups",
  "libdrm",
  "dbus",
  "libxkbcommon",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.libXcursor",
  "xorg.libXi",
  "xorg.libXrender",
  "xorg.libXtst",
  "mesa",
  "expat",
  "pango",
  "cairo",
  "alsa-lib",
  "fontconfig",
  "freetype",
  "gdk-pixbuf",
  "gtk3"
]
 
[phases.install]
cmds = [
  "npm install",
  "npx puppeteer browsers install chrome"
]
 
[start]
cmd = "PUPPETEER_EXECUTABLE_PATH=$(which chromium) node bot.js"
 
