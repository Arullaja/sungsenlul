🚀 Cara Deploy ke Railway
Langkah 1 — Upload ke GitHub
Buka github.com → buat akun jika belum punya
Klik New Repository → beri nama wa-rental-bot → Create
Upload semua file: bot.js, package.json, nixpacks.toml, .gitignore
Langkah 2 — Deploy di Railway
Buka railway.app → login dengan akun GitHub
Klik New Project → Deploy from GitHub repo
Pilih repo wa-rental-bot
Railway otomatis detect dan build
Langkah 3 — Set Environment Variables
Di Railway dashboard → Variables → tambahkan:

PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = true
PUPPETEER_EXECUTABLE_PATH = /run/current-system/sw/bin/chromium
Langkah 4 — Lihat QR Code
Klik tab Deployments → View Logs
QR code akan muncul di log
Scan dari WhatsApp HP seperti biasa
⚠️ Penting: Setiap bot direstart, QR perlu di-scan ulang. Setelah scan pertama, sesi tersimpan dan tidak perlu scan lagi selama tidak dihapus.


