Untuk bot WhatsApp dengan balas otomatis + button interaktif, kita perlu menggunakan library whatsapp-web.js (Node.js). Saya akan buatkan script lengkap beserta UI dashboard-nya.

Saya akan buatkan dua file: script bot WhatsApp (Node.js) dan panduan setup lengkap.


Membuat 3 file, menjalankan 2 perintah, membaca file
Membuat 3 file, menjalankan 2 perintah, membaca file
Berikut 3 file yang sudah siap, cara pakainya singkat:

Setup (sekali saja):

Install Node.js dari nodejs.org (pilih versi LTS)
Buat folder wa-rental-bot, letakkan bot.js + package.json di dalamnya
Buka CMD → cd C:\wa-rental-bot → npm install
Konfigurasi — buka bot.js, edit bagian CONFIG di atas:

noAdmin → nomor WA Anda (format: 628xxxx)
namaPerusahaan, lokasi, jamOperasional
Data mobil di bagian ARMADA (nama, harga, kapasitas)
Jalankan:

node bot.js
Scan QR yang muncul di CMD pakai WhatsApp → bot langsung aktif.

Fitur yang sudah ada:

🔘 Tombol interaktif (Buttons & List menu) di chat WA
📅 Alur booking otomatis: pilih mobil → nama → tanggal → sopir → konfirmasi
🔔 Notifikasi ke nomor admin setiap ada pesanan masuk
📋 Daftar syarat, lokasi, dan kontak admin
⌨️ Fallback ke teks jika HP pelanggan tidak support tombol

